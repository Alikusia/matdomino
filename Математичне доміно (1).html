<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Математичне доміно</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700&family=Open+Sans:wght@400;700&display=swap">
<style>
:root{color-scheme:light;--bg:#f7f1e8;--tile:#fffdf8;--line:#7c5642;--ink:#4a3226;--acc:#9C6644;--soft:#efe2d2;--ok:#4f8a4b;--bad:#b5543f;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Open Sans',system-ui,sans-serif;min-height:100vh}
h1,.mt{font-family:'Montserrat',system-ui,sans-serif;font-weight:700}
.wrap{max-width:1000px;margin:0 auto;padding:8px 12px 12px}
h1{margin:0 0 1px;font-size:clamp(18px,4vw,25px);text-align:center;color:var(--line)}
.sub{margin:0 0 7px;text-align:center;color:var(--acc);font-size:12.5px;line-height:1.3}
.bar{display:flex;flex-wrap:wrap;gap:6px;align-items:center;justify-content:center;margin-bottom:4px}
button{font:700 13px 'Open Sans',sans-serif;background:var(--acc);color:#fff;border:0;border-radius:9px;padding:6px 11px;cursor:pointer}
button.sec{background:var(--soft);color:var(--line);border:1.5px solid var(--acc)}
.cnt{font-size:14px;font-weight:700;color:var(--line);margin:0 6px}
.lab{font-size:13px;font-weight:700;color:var(--acc);margin:5px 4px 3px;letter-spacing:.04em}
#chain{min-height:76px;border:2px dashed var(--acc);border-radius:14px;padding:6px;display:flex;flex-wrap:wrap;gap:5px;align-content:flex-start;background:#fbf6ee;transition:background .15s}
#chain.hov{background:#f1e4d3}
#chain .ph{color:var(--acc);font-size:14px;margin:auto;text-align:center;width:100%}
#msg{min-height:18px;margin:4px 0 0;text-align:center;font-weight:700;font-size:13.5px}
#tray{display:grid;grid-template-columns:repeat(auto-fill,minmax(124px,1fr));gap:6px;justify-items:center}
.tile{width:124px;height:54px;background:var(--tile);border:2.5px solid var(--line);border-radius:12px;display:flex;align-items:stretch;user-select:none;-webkit-user-select:none;touch-action:none;cursor:grab;position:relative;box-shadow:0 2px 0 var(--line);transition:transform .25s}
.tile .l{flex:0 0 46%;display:flex;align-items:center;justify-content:center;font-family:'Montserrat',sans-serif;font-weight:700;font-size:22px;color:var(--line);background:var(--soft);border-radius:9px 0 0 9px}
.tile .d{width:3px;background:var(--line);margin:6px 0;border-radius:2px}
.tile .r{flex:1;display:flex;align-items:center;justify-content:center;text-align:center;padding:0 4px;font-weight:700;font-size:12px;line-height:1.15}
.tile.drag{transition:none;cursor:grabbing;z-index:50;box-shadow:0 10px 22px rgba(0,0,0,.28);opacity:.95}
.tile.bad{animation:sh .35s;border-color:var(--bad)}
@keyframes sh{20%,60%{transform:translateX(-7px)}40%,80%{transform:translateX(7px)}}
#chain .tile{cursor:default;box-shadow:0 2px 0 var(--ok);border-color:var(--ok)}
#chain .tile .d{background:var(--ok)}
.ban{display:none;margin-top:6px;padding:8px 10px;border-radius:14px;background:#fff;border:2.5px solid var(--acc);text-align:center}
.ban.on{display:block}.ban b{font-family:'Montserrat',sans-serif;font-size:clamp(17px,4.6vw,24px);color:var(--line)}
.ban p{margin:6px 0 0;font-size:14px}
#fwv{display:none;position:fixed;left:0;top:0;width:100%;height:100%;z-index:100;background:rgba(247,241,232,.92);align-items:center;justify-content:center;flex-direction:column;text-align:center;padding:12px;cursor:pointer}#fwv.on{display:flex}#fwv video{width:min(76vw,56vh,440px);border-radius:18px;box-shadow:0 8px 28px rgba(0,0,0,.25)}#fwv b{font-family:'Montserrat',sans-serif;font-size:clamp(18px,4.8vw,28px);color:var(--line);margin-bottom:12px}#fwv span{font-size:13px;color:var(--acc);margin-top:10px}
.nick{text-align:center;color:var(--acc);font-size:12px;margin-top:6px}
</style>
</head>
<body>
<div class="wrap">
<h1>Математичне доміно</h1>
<p class="sub">Обчисли умову з правої частини плиточки й перетягни до ланцюжка плиточку, у якої зліва стоїть твоя відповідь</p>

<span class="cnt" id="cnt">Використано: 0 / 24</span>
<button id="shuf" class="sec">Перемішати</button>
<button id="undo" class="sec">Крок назад</button>
<button id="done">Ланцюжок завершено</button>
<button id="rst">Почати заново</button>
</div>

<script>
/* [число зліва, дія, число в умові]; p = «на k більше», m = «на k менше», x = «у k разів більше», d = «у k разів менше» */
var D=[[27,"m",6],[21,"m",3],[18,"x",2],[36,"m",2],[34,"p",6],[40,"m",5],[35,"m",4],[31,"m",5],[26,"p",2],[28,"p",10],[38,"m",5],[33,"m",4],[29,"p",10],[39,"d",3],[13,"p",2],[15,"d",3],[5,"x",2],[10,"x",2],[20,"p",4],[24,"d",2],[12,"d",2],[6,"d",2],[3,"x",3],[9,"x",3]];
function pl(k){return k===5?"разів":"рази"}
var TL=D.map(function(t,i){
 var l=t[0],o=t[1],k=t[2],r={p:l+k,m:l-k,x:l*k,d:l/k}[o];
 var tx={p:"На "+k+" більше",m:"На "+k+" менше",x:"У "+k+" "+pl(k)+" більше",d:"У "+k+" "+pl(k)+" менше"}[o];
 return {id:i,l:l,t:tx,r:r}});
var chain=[],tray=[],$=function(i){return document.getElementById(i)};
function shuffle(a){for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1)),x=a[i];a[i]=a[j];a[j]=x}return a}
function tileEl(t){
 var e=document.createElement("div");e.className="tile";e.setAttribute("data-id",t.id);
 e.innerHTML='<div class="l">'+t.l+'</div><div class="d"></div><div class="r">'+t.t+'</div>';return e}
function say(s,c){var m=$("msg");m.textContent=s;m.style.color=c||"var(--ink)"}
function banner(h,p){var b=$("ban");if(!h){b.className="ban";return}b.className="ban on";b.innerHTML="<b>"+h+"</b><p>"+p+"</p>"}
function render(){
 var c=$("chain"),t=$("tray");c.innerHTML="";t.innerHTML="";
 if(!chain.length)c.innerHTML='<div class="ph">Перетягни сюди плиточку, з якої хочеш почати</div>';
 chain.forEach(function(x){c.appendChild(tileEl(x))});
 tray.forEach(function(x){var e=tileEl(x);bind(e);t.appendChild(e)});
 $("cnt").textContent="Використано: "+chain.length+" / 24";
}
function reset(){stopFw();chain=[];tray=shuffle(TL.slice());banner();say("");render()}
function attempt(id,el){
 var t=TL[id];
 if(!chain.length||chain[chain.length-1].r===t.l){
  tray=tray.filter(function(x){return x.id!==id});chain.push(t);banner();
  say(chain.length===1?"Починаємо! Обчисли умову на правій частині.":"Вірно!","var(--ok)");render();
  if(chain.length===24)fireworks();if(chain.length===24)banner("МАТЕМАТИЧНИЙ ЛАНЦЮЖОК ЗАВЕРШЕНО!","Усі 24 плиточки використано.");
 }else{
  say("Ця плиточка не підходить: зліва має бути твоя відповідь.","var(--bad)");
  if(el){el.classList.remove("bad");void el.offsetWidth;el.classList.add("bad")}
 }
}
function bind(el){
 var sx,sy,mv=false,dr=false,id=+el.getAttribute("data-id");
 function over(x,y){el.style.pointerEvents="none";var e=document.elementFromPoint(x,y);el.style.pointerEvents="";return e&&e.closest?e.closest("#chain"):null}
 el.addEventListener("pointerdown",function(e){dr=true;mv=false;sx=e.clientX;sy=e.clientY;try{el.setPointerCapture(e.pointerId)}catch(_){}});
 el.addEventListener("pointermove",function(e){
  if(!dr)return;var dx=e.clientX-sx,dy=e.clientY-sy;
  if(!mv&&Math.abs(dx)+Math.abs(dy)>6){mv=true;el.classList.add("drag")}
  if(!mv)return;el.style.transform="translate("+dx+"px,"+dy+"px) rotate(-3deg)";
  $("chain").classList.toggle("hov",!!over(e.clientX,e.clientY));
 });
 el.addEventListener("pointerup",function(e){
  if(!dr)return;dr=false;el.classList.remove("drag");$("chain").classList.remove("hov");
  if(mv){var ok=over(e.clientX,e.clientY);el.style.transform="";if(ok)attempt(id,el)}
  else attempt(id,el);
 });
 el.addEventListener("pointercancel",function(){dr=false;el.classList.remove("drag");el.style.transform=""});
}
$("shuf").onclick=function(){tray=shuffle(tray);render()};
$("rst").onclick=reset;
$("undo").onclick=function(){if(!chain.length)return;tray.push(chain.pop());tray=shuffle(tray);banner();say("");render()};
$("done").onclick=function(){
 if(!chain.length){say("Спочатку побудуй ланцюжок: перетягни першу плиточку.","var(--bad)");return}
 if(chain.length===24){fireworks();banner("МАТЕМАТИЧНИЙ ЛАНЦЮЖОК ЗАВЕРШЕНО!","Усі 24 плиточки використано.");return}
 var r=chain[chain.length-1].r,more=tray.some(function(x){return x.l===r});
 if(more){banner();say("Ще є плиточка, яка підходить. Продовжуй пошук!","var(--bad)")}
 else banner("Математичний ланцюжок завершено!","Підходящих плиточок більше немає. Ти з’єднав(ла) "+chain.length+" з 24. Спробуй інший початок: «Крок назад» або «Почати заново».");
};
function stopFw(){$("fwv").className="";try{$("fwvid").pause()}catch(e){}}
function fireworks(){var v=$("fwvid");$("fwv").className="on";try{v.currentTime=0;var p=v.play();if(p&&p.catch)p.catch(function(){})}catch(e){}}
$("fwv").onclick=stopFw;
reset();
</script>
